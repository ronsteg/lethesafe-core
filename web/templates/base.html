<!doctype html>
<html lang="de" class="h-100">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lethesafe Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
  <header class="ls-header">
    <div class="ls-header__inner">
      <a href="{{ url_for('index') }}" class="ls-brand">Lethesafe</a>
      <nav>
        <a href="{{ url_for('create_view') }}">Neu</a>
        <a href="{{ url_for('clone_view') }}">Clone</a>
        <a href="{{ url_for('unlock_view') }}">Unlock</a>
      </nav>
    </div>
  </header>
  <main class="ls-main">
    {% block content %}{% endblock %}
  </main>
<footer class="ls-footer">
  <span>Lokale WebApp – Daten verlassen dein Gerät nicht.</span>
  <span class="ls-version">
    Lethesafe<span class="ls-reg">&trade;</span>
    v{{ WEB_VERSION }} (Core v{{ CORE_VERSION }})
  </span>
</footer>

  <script src="{{ url_for('static', filename='lethesafe.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>

</html>
